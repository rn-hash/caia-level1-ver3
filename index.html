<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAIA Level 1 合格決定版 ver3</title>
<style>
:root {
  --bg: #0f1420; --card: #1a2233; --card2: #212c42; --accent: #34c759;
  --accent2: #0a84ff; --warn: #ff9f0a; --text: #e8edf5; --dim: #8a94a6;
  --border: #2c3a52;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif; line-height:1.65; }
#lock-screen {
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  background-image:radial-gradient(circle at 20% 20%, #1a2740 0%, var(--bg) 60%);
}
.lock-box { text-align:center; max-width:420px; padding:40px; }
.lock-box h1 { font-size:26px; margin-bottom:8px; color:var(--accent); }
.lock-box p { color:var(--dim); margin-bottom:28px; font-size:14px; }
.lock-box input {
  width:100%; padding:14px 16px; font-size:16px; border-radius:10px;
  border:2px solid var(--border); background:var(--card); color:var(--text);
  text-align:center; letter-spacing:2px; margin-bottom:14px; outline:none;
}
.lock-box input:focus { border-color:var(--accent2); }
.lock-box button {
  width:100%; padding:14px; font-size:16px; font-weight:bold; border-radius:10px;
  border:none; background:var(--accent2); color:#fff; cursor:pointer;
}
.lock-box button:hover { opacity:0.9; }
#lock-msg { color:#ff453a; font-size:13px; margin-top:10px; min-height:20px; }
.app-hidden { display:none !important; }

#header {
  position:sticky; top:0; z-index:50; background:rgba(15,20,32,0.95); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:14px 20px;
}
#header h1 { font-size:18px; color:var(--accent); }
#header .sub { font-size:12px; color:var(--dim); margin-top:2px; }
#header .meta { font-size:12px; color:var(--dim); margin-top:4px; }
#reset-btn { float:right; font-size:11px; color:var(--dim); background:none; border:none; cursor:pointer; text-decoration:underline; }
#filters { display:flex; gap:8px; overflow-x:auto; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:88px; z-index:40; }
.chip {
  white-space:nowrap; padding:6px 14px; border-radius:20px; font-size:12px;
  background:var(--card); border:1px solid var(--border); color:var(--text);
  cursor:pointer; user-select:none;
}
.chip.active { background:var(--accent); border-color:var(--accent); color:#082; font-weight:bold; }
#progress-bar { height:4px; background:var(--border); }
#progress-fill { height:100%; background:var(--accent); width:0%; transition:width 0.3s; }
#content { max-width:860px; margin:0 auto; padding:20px; }
.qcard {
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:22px 24px; margin-bottom:18px;
}
.qhead { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.qno { font-size:13px; font-weight:bold; color:var(--accent2); background:rgba(10,132,255,0.12); padding:3px 10px; border-radius:6px; }
.qtopic { font-size:12px; color:var(--dim); }
.qbody { font-size:15px; font-weight:500; margin-bottom:16px; }
.opts { display:flex; flex-direction:column; gap:8px; }
.opt {
  padding:12px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--card2); cursor:pointer; transition:all 0.15s; font-size:14px;
}
.opt:hover { border-color:var(--accent2); }
.opt .key { display:inline-block; width:24px; height:24px; text-align:center; line-height:24px; border-radius:6px; background:var(--card); border:1px solid var(--border); margin-right:10px; font-weight:bold; font-size:12px; }
.opt.correct { border-color:var(--accent); background:rgba(52,199,89,0.12); }
.opt.correct .key { background:var(--accent); color:#082; border-color:var(--accent); }
.opt.wrong { border-color:#ff453a; background:rgba(255,69,58,0.08); }
.opt.wrong .key { background:#ff453a; color:#fff; border-color:#ff453a; }
.opt.dim { opacity:0.45; }

.answer-box { margin-top:16px; border-top:1px solid var(--border); padding-top:16px; }
.answer-line { font-size:15px; font-weight:bold; color:var(--accent); margin-bottom:8px; }
.trick-box { background:rgba(255,159,10,0.08); border-left:4px solid var(--warn); padding:12px 14px; border-radius:0 8px 8px 0; margin-bottom:12px; }
.trick-box .label { font-size:11px; font-weight:bold; color:var(--warn); margin-bottom:4px; }
.trick-box .content { font-size:13px; white-space:pre-wrap; color:var(--text); }
.expl-box { margin-bottom:12px; }
.expl-box .label { font-size:11px; font-weight:bold; color:var(--accent2); margin-bottom:4px; }
.expl-box .content { font-size:14px; white-space:pre-wrap; }
.ba2-box { background:rgba(10,132,255,0.06); border-left:4px solid var(--accent2); padding:12px 14px; border-radius:0 8px 8px 0; margin-bottom:12px; }
.ba2-box .label { font-size:11px; font-weight:bold; color:var(--accent2); margin-bottom:4px; }
.ba2-box .content { font-size:13px; white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace; }
.lo-line { font-size:12px; color:var(--dim); }
#summary { text-align:center; padding:30px 20px; color:var(--dim); font-size:14px; }
</style>
</head>
<body>

<!-- ロック画面 -->
<div id="lock-screen">
  <div class="lock-box">
    <h1>🔒 CAIA Level 1 合格決定版</h1>
    <p>本番予想問題 240問 解答解説完全版<br>パスワードを入力してください</p>
    <input type="password" id="pw-input" placeholder="パスワード" autocomplete="off">
    <button id="pw-btn">ロック解除</button>
    <div id="lock-msg"></div>
  </div>
</div>

<!-- メイン画面 -->
<div id="app" class="app-hidden">
  <div id="header">
    <button id="reset-btn">ロックに戻る</button>
    <h1>🏆 CAIA Level 1 合格決定版 ver3</h1>
    <div class="sub">本番予想問題 解答解説完全版（秒殺テク＋BA II Plus手順付き）</div>
    <div class="meta" id="meta-info"></div>
  </div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="filters"></div>
  <div id="content"></div>
  <div id="summary"></div>
</div>

let QUESTIONS = null;
let GROUPS = [];
let currentGroup = 'all';
let answered = {};

const lockScreen = document.getElementById('lock-screen');
const appEl = document.getElementById('app');
const pwInput = document.getElementById('pw-input');
const pwBtn = document.getElementById('pw-btn');
const lockMsg = document.getElementById('lock-msg');

// ===== 復号ロジック =====
function buf2hex(buf) { return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''); }
function base64ToBuf(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function decrypt(pw) {
  // 16進ソルト → Uint8Array
  const saltBytes = new Uint8Array(SALT_HEX.match(/../g).map(h => parseInt(h, 16)));
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: ITERS, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const iv = base64ToBuf(NONCE_B64);
  const ct = base64ToBuf(CT_B64);
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(plain);
  } catch (e) {
    return null;
  }
}

async function unlock() {
  const pw = pwInput.value;
  if (!pw) { lockMsg.textContent = 'パスワードを入力してください'; return; }
  pwBtn.disabled = true;
  pwBtn.textContent = '解読中…';
  const plain = await decrypt(pw);
  if (!plain) {
    lockMsg.textContent = 'パスワードが違います';
    pwInput.value = '';
    pwBtn.disabled = false;
    pwBtn.textContent = 'ロック解除';
    return;
  }
  const data = JSON.parse(plain);
  QUESTIONS = data.questions;
  GROUPS = data.groups;
  sessionStorage.setItem('caia_unlocked', '1');
  lockScreen.classList.add('app-hidden');
  appEl.classList.remove('app-hidden');
  render();
}

pwBtn.addEventListener('click', unlock);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('reset-btn').addEventListener('click', () => {
  sessionStorage.removeItem('caia_unlocked');
  QUESTIONS = null;
  appEl.classList.add('app-hidden');
  lockScreen.classList.remove('app-hidden');
});

// ===== レンダリング =====
function render() {
  document.getElementById('meta-info').textContent = '全 ' + QUESTIONS.length + ' 問 ｜ 正解率: ' + scorePct() + '%';
  renderFilters();
  renderQuestions();
}

function renderFilters() {
  const f = document.getElementById('filters');
  f.innerHTML = '';
  const chips = [['all', 'すべて (' + QUESTIONS.length + ')']].concat(GROUPS.map(g => [g, g]));
  chips.forEach(([val, label]) => {
    const c = document.createElement('span');
    c.className = 'chip' + (currentGroup === val ? ' active' : '');
    c.textContent = label;
    c.onclick = () => { currentGroup = val; render(); };
    f.appendChild(c);
  });
}

function renderQuestions() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const filtered = QUESTIONS.filter(q => currentGroup === 'all' || q.group === currentGroup);
  if (filtered.length === 0) {
    content.innerHTML = '<div id="summary">このグループの問題はありません</div>';
    return;
  }
  filtered.forEach(q => content.appendChild(questionCard(q)));
  updateProgress();
}

function questionCard(q) {
  const card = document.createElement('div');
  card.className = 'qcard';

  const head = document.createElement('div');
  head.className = 'qhead';
  const no = document.createElement('span');
  no.className = 'qno';
  no.textContent = 'Q' + q.id;
  const topic = document.createElement('span');
  topic.className = 'qtopic';
  topic.textContent = q.group + ' ｜ ' + q.topic;
  head.appendChild(no); head.appendChild(topic);

  const body = document.createElement('div');
  body.className = 'qbody';
  body.textContent = q.body;

  const optsWrap = document.createElement('div');
  optsWrap.className = 'opts';

  const sel = answered[q.id];
  ['A','B','C','D'].forEach((k, i) => {
    const opt = document.createElement('div');
    opt.className = 'opt';
    if (sel) {
      if (k === q.answer) opt.classList.add('correct');
      else if (k === sel) opt.classList.add('wrong');
      else opt.classList.add('dim');
    }
    const key = document.createElement('span');
    key.className = 'key';
    key.textContent = k;
    const txt = document.createElement('span');
    txt.textContent = q.opts[i];
    opt.appendChild(key); opt.appendChild(txt);
    opt.onclick = () => { if (!sel) { answered[q.id] = k; render(); } };
    optsWrap.appendChild(opt);
  });

  card.appendChild(head); card.appendChild(body); card.appendChild(optsWrap);

  if (sel) {
    const box = document.createElement('div');
    box.className = 'answer-box';
    const ansLine = document.createElement('div');
    ansLine.className = 'answer-line';
    ansLine.textContent = '正解: ' + q.answer + '  ｜ あなたの回答: ' + sel + (sel === q.answer ? ' ✅' : ' ❌');
    box.appendChild(ansLine);
    if (q.trick) {
      const trick = document.createElement('div');
      trick.className = 'trick-box';
      trick.innerHTML = '<div class="label">⚡ 秒殺テク</div><div class="content">' + esc(q.trick) + '</div>';
      box.appendChild(trick);
    }
    if (q.expl) {
      const expl = document.createElement('div');
      expl.className = 'expl-box';
      expl.innerHTML = '<div class="label">📖 解説</div><div class="content">' + esc(q.expl) + '</div>';
      box.appendChild(expl);
    }
    if (q.ba2) {
      const ba2 = document.createElement('div');
      ba2.className = 'ba2-box';
      ba2.innerHTML = '<div class="label">🧮 BA II Plus 手順</div><div class="content">' + esc(q.ba2) + '</div>';
      box.appendChild(ba2);
    }
    const lo = document.createElement('div');
    lo.className = 'lo-line';
    lo.textContent = 'LO: ' + (q.lo || 'なし');
    box.appendChild(lo);
    card.appendChild(box);
  }
  return card;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function updateProgress() {
  const done = Object.keys(answered).length;
  const pct = Math.round(done / (QUESTIONS.length || 1) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function scorePct() {
  const done = Object.keys(answered).length;
  if (done === 0) return '0';
  const correct = QUESTIONS.filter(q => answered[q.id] && answered[q.id] === q.answer).length;
  return Math.round(correct / done * 100);
}
